# Static SPA server. Listens on 8080 (never 80/443 — the shared Caddy edge terminates TLS
# and proxies to this container by network alias).
#
# Caching contract:
#   - hashed build assets and self-hosted fonts: immutable, one year
#   - index.html, manifest, service worker: revalidate every time
#   - /healthz: deterministic, no log noise
#   - a missing asset under a real asset path is a 404, never the SPA shell

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version.
    server_tokens off;

    # Deterministic health probe for the container healthcheck and the edge.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # These three change with every deploy: never serve them stale.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build output and the OFL webfont subsets are content-addressed in practice;
    # `^~` keeps the extension-404 rule below from overriding their cache headers.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A request for a file that does not exist is a 404 — it must not fall through to the
    # shell, or a typo'd asset would answer 200 with HTML.
    location ~* \.(?:js|css|png|svg|ico|webmanifest|json|woff2|txt|map)$ {
        try_files $uri =404;
    }

    # Application routes: serve the SPA shell, which resolves the route client-side.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
